services:
  postgres:
    image: postgres:16-alpine
    container_name: coldchainos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coldchainos_db
      POSTGRES_USER: coldchain_admin
      POSTGRES_PASSWORD: coldchain_secret_password
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldchain_admin -d coldchainos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
