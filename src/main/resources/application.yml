spring:
  application:
    name: coldchainos
  main:
    banner-mode: off

  datasource:
    url: jdbc:postgresql://localhost:5438/coldchainos_db
    username: coldchain_admin
    password: coldchain_secret_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: ColdChainHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6389}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: coldchain-telemetry-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

coldchainos:
  outbox:
    relay-interval-ms: 2000
  telemetry:
    raw-topic: coldchain.telemetry.raw
    dlq-topic: coldchain.telemetry.dlq

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

resilience4j:
  circuitbreaker:
    instances:
      complianceClearinghouse:
        sliding-window-size: 6
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1000ms
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      complianceClearinghouse:
        max-attempts: 3
        wait-duration: 100ms
        retry-exceptions:
          - com.coldchainos.shipment.infrastructure.external.ExternalServiceException

coldchain:
  rate-limit:
    default-capacity: 10
    default-refill-rate-per-second: 5

gemini:
  api-key: ${GEMINI_API_KEY:demo}
  model-name: ${GEMINI_MODEL_NAME:gemini-1.5-flash}
  temperature: 0.1

