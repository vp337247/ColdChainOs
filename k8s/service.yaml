apiVersion: v1
kind: Service
metadata:
  name: coldchainos-service
  namespace: coldchainos
  labels:
    app.kubernetes.io/name: coldchainos
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
      protocol: TCP
  selector:
    app: coldchainos-app
