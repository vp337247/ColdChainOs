version: '3.8'

services:
  # =========================================================================
  # 1. Primary PostgreSQL 16 (Multi-Tenant Relational Storage & JSONB Outbox)
  # =========================================================================
  postgres-primary:
    image: postgres:16-alpine
    container_name: coldchainos-postgres-prod
    environment:
      POSTGRES_DB: coldchainos_db
      POSTGRES_USER: coldchain_admin
      POSTGRES_PASSWORD: coldchain_prod_secret
    command: >
      postgres
        -c shared_buffers=512MB
        -c max_connections=200
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c effective_cache_size=1536MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldchain_admin -d coldchainos_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # =========================================================================
  # 2. Redis 7 (Hot Telemetry Cache, Rate Limiting & Dedup)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: coldchainos-redis-prod
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy volatile-lru
        --save 900 1
        --appendonly yes
    volumes:
      - redis_prod_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  # =========================================================================
  # 3. Apache Kafka 3.7 KRaft (High-Throughput Streaming & Outbox Relay)
  # =========================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: coldchainos-kafka-prod
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: '4L62EnnTQnGv0BOFsUVlvA'
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # =========================================================================
  # 4. ColdChainOS Production Modular Monolith Application
  # =========================================================================
  coldchainos-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coldchainos-app-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-primary:5432/coldchainos_db?prepareThreshold=5&reWriteBatchedInserts=true
      SPRING_DATASOURCE_USERNAME: coldchain_admin
      SPRING_DATASOURCE_PASSWORD: coldchain_prod_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # =========================================================================
  # 5. Prometheus Observability & Metrics Scraper
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: coldchainos-prometheus-prod
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_prod_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  postgres_prod_data:
  redis_prod_data:
  kafka_prod_data:
  prometheus_prod_data:
